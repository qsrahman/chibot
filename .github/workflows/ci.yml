# The fast checks on every push and pull request: the same ones the guide asks
# for before each commit, without the browser tests (pnpm test:e2e), which run
# on the developer's machine before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm 12 downloads the exact version package.json asks for (devEngines).
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the import rules (tests/architecture.test.ts).
      - run: pnpm test
      - run: pnpm format:check
